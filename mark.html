</head>
<body class="bg-gray-100 min-h-screen font-sans">

            <div class="bg-white rounded-xl shadow-md p-6 mb-6">

        <!-- 添加成绩弹窗 (默认隐藏) -->
        <div id="add-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
            <div class="bg-white rounded-xl shadow-2xl w-full max-w-md p-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-bold text-gray-800">添加考试</h3>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">考试名称</label>
                    <input type="text" id="modal-name" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" placeholder="例如：期中考试">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">学科</label>
                    <input type="text" id="modal-subject" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" placeholder="例如：数学">
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-1">满分</label>
                    <input type="number" id="modal-full-score" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" placeholder="100">
                </div>
                <button id="save-card-btn" class="bg-blue-600 text-white w-full py-2 rounded-lg hover:bg-blue-700 transition-all">保存</button>
            </div>
        </div>

        <!-- 录入成绩弹窗 (默认隐藏) -->

            <div class="bg-white rounded-xl shadow-2xl w-full max-w-md p-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-bold text-gray-800">录入成绩</h3>
                    <button id="close-score-modal-btn" class="text-gray-400 hover:text-gray-600">
                        <i class="fa fa-times"></i>
                    </button>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">考试日期</label>
                    <input type="date" id="score-date" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-1">分数</label>
                    <input type="number" id="score-value" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" placeholder="输入分数">
                </div>
                <button id="save-score-btn" class="bg-blue-600 text-white w-full py-2 rounded-lg hover:bg-blue-700 transition-all">保存</button>
            </div>
        </div>

        <!-- 综合命名弹窗 (默认隐藏) -->
        <div id="synthesize-name-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
            <div class="bg-white rounded-xl shadow-2xl w-full max-w-md p-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-bold text-gray-800">命名综合分析</h3>
                    <button id="close-synthesize-name-modal-btn" class="text-gray-400 hover:text-gray-600">
                        <i class="fa fa-times"></i>
                    </button>
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-1">综合分析名称</label>
                    <input type="text" id="synthesize-name" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" placeholder="例如：理科综合">
                </div>
                <button id="save-synthesize-btn" class="bg-blue-600 text-white w-full py-2 rounded-lg hover:bg-blue-700 transition-all">保存</button>
            </div>
        </div>

        <!-- 底部导入区域 -->
        <div class="mt-10 pt-6 border-t border-gray-300 text-center">
            <p class="text-gray-500 text-sm mb-2">数据存储在浏览器本地，如需迁移请使用导入/导出功能</p>
            <div class="flex justify-center space-x-4">
                <button id="import-btn" class="bg-gray-600 text-white px-4 py-2 rounded-lg hover:bg-gray-700 transition-all">
                    <i class="fa fa-upload mr-2"></i>导入数据
                </button>
                <button id="export-all-btn" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition-all">
                    <i class="fa fa-download mr-2"></i>导出全部数据
                </button>
            </div>
            <input type="file" id="file-input" accept=".json" class="hidden" />
        </div>

    <script>
        // 数据结构
        let exams = [];
        let synthesizeExams = [];
        let currentExamId = null;
        let currentSynthesizeId = null;
        let isSelecting = false;
        let selectedExamIds = [];
        let chartInstances = {};

        // DOM 元素
        const homePage = document.getElementById('home-page');
        const detailPage = document.getElementById('detail-page');
        const synthesizeDetailPage = document.getElementById('synthesize-detail-page');
        const cardsContainer = document.getElementById('cards-container');
        const synthesizeCardsContainer = document.getElementById('synthesize-cards-container');
        const addCardBtn = document.getElementById('add-card-btn');
        const addModal = document.getElementById('add-modal');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const saveCardBtn = document.getElementById('save-card-btn');
        const modalName = document.getElementById('modal-name');
        const modalSubject = document.getElementById('modal-subject');
        const modalFullScore = document.getElementById('modal-full-score');
        const backBtn = document.getElementById('back-btn');
        const synthesizeBackBtn = document.getElementById('synthesize-back-btn');
        const detailTitle = document.getElementById('detail-title');
        const detailFullScore = document.getElementById('detail-full-score');
        const detailLastScore = document.getElementById('detail-last-score');
        const detailPredictScore = document.getElementById('detail-predict-score');
        const addScoreBtn = document.getElementById('add-score-btn');
        const scoreModal = document.getElementById('score-modal');
        const closeScoreModalBtn = document.getElementById('close-score-modal-btn');
        const saveScoreBtn = document.getElementById('save-score-btn');
        const scoreDate = document.getElementById('score-date');
        const scoreValue = document.getElementById('score-value');
        const exportDataBtn = document.getElementById('export-data-btn');
        const exportImageBtn = document.getElementById('export-image-btn');
        const synthesizeExportDataBtn = document.getElementById('synthesize-export-data-btn');
        const synthesizeExportImageBtn = document.getElementById('synthesize-export-image-btn');
        const synthesizeBtn = document.getElementById('synthesize-btn');
        const synthesizeBtnText = document.getElementById('synthesize-btn-text');
        const sortSelect = document.getElementById('sort-select');
        const synthesizeNameModal = document.getElementById('synthesize-name-modal');
        const closeSynthesizeNameModalBtn = document.getElementById('close-synthesize-name-modal-btn');
        const saveSynthesizeBtn = document.getElementById('save-synthesize-btn');
        const synthesizeName = document.getElementById('synthesize-name');
        const importBtn = document.getElementById('import-btn');
        const exportAllBtn = document.getElementById('export-all-btn');
        const fileInput = document.getElementById('file-input');
        const synthesizeDetailTitle = document.getElementById('synthesize-detail-title');

        // 初始化
        async function init() {
            await loadData();
            renderCards();
            renderSynthesizeCards();
        }

        // 保存数据到 localStorage
        function saveData() {
            localStorage.setItem('examData', JSON.stringify(exams));
            localStorage.setItem('synthesizeExams', JSON.stringify(synthesizeExams));
            console.log('数据已保存到本地');
        }

        // 从 localStorage 加载数据
        async function loadData() {
            const examData = localStorage.getItem('examData');
            const synthesizeData = localStorage.getItem('synthesizeExams');
            if (examData) {
                exams = JSON.parse(examData);
            } else {
                exams = [];
            }
            if (synthesizeData) {
                synthesizeExams = JSON.parse(synthesizeData);
            } else {
                synthesizeExams = [];
            }
        }

        // 排序卡片
        function sortCards(type) {
            switch (type) {
                case 'subject':
                    exams.sort((a, b) => a.subject.localeCompare(b.subject));
                    break;
                case 'avg':
                    exams.sort((a, b) => {
                        const avgA = a.scores.length > 0 ? a.scores.reduce((sum, s) => sum + s.value, 0) / a.scores.length : 0;
                        const avgB = b.scores.length > 0 ? b.scores.reduce((sum, s) => sum + s.value, 0) / b.scores.length : 0;
                        return avgB - avgA;
                    });
                    break;
                case 'latest':
                    exams.sort((a, b) => {
                        const dateA = a.scores.length > 0 ? new Date(a.scores[a.scores.length - 1].date).getTime() : 0;
                        const dateB = b.scores.length > 0 ? new Date(b.scores[b.scores.length - 1].date).getTime() : 0;
                        return dateB - dateA;
                    });
                    break;
            }
        }

        // 辅助函数：提取成绩峰值（高于平均值的点）
        function getPeakScores(scores) {
            if (scores.length < 3) return [];
            const avg = scores.reduce((sum, s) => sum + s.value, 0) / scores.length;
            return scores.filter(s => s.value > avg).map(s => s.value);
        }

        // 核心：峰值均值回归+同比增长 成绩预测算法
        function predictNextScore(scores, fullScore) {
            // 至少需要3次成绩才进行预测
            if (scores.length < 3) return null;
            
            // 1. 计算整体平均值
            const totalAvg = scores.reduce((sum, s) => sum + s.value, 0) / scores.length;
            // 2. 提取所有峰值（高于整体平均值的成绩）并计算峰值均值
            const peakScores = getPeakScores(scores);
            const peakAvg = peakScores.length > 0 ? peakScores.reduce((sum, val) => sum + val, 0) / peakScores.length : totalAvg;
            // 3. 计算最近两次的同比增长率
            const lastScore = scores[scores.length - 1].value;
            const prevScore = scores[scores.length - 2].value;
            const growthRate = (lastScore - prevScore) / prevScore;
            // 4. 峰值均值回归修正：权重 峰值均值0.6 + 增长预测0.4
            const growthPredict = lastScore * (1 + growthRate);
            const predictScore = peakAvg * 0.6 + growthPredict * 0.4;
            // 5. 限制在0-满分之间
            return Math.round(Math.max(0, Math.min(predictScore, fullScore)));
        }

        // 辅助函数：判断是否低于平均值
        function isBelowAverage(scores) {
            if (scores.length < 2) return false;
            const avg = scores.reduce((sum, s) => sum + s.value, 0) / scores.length;
            const lastScore = scores[scores.length - 1].value;
            return lastScore < avg;
        }

        // 渲染卡片
        function renderCards() {
            cardsContainer.innerHTML = '';
            if (exams.length === 0) {
                cardsContainer.innerHTML = '<div class="col-span-full text-center py-10 text-gray-400">暂无考试数据，请点击右上角 "+" 添加</div>';
                return;
            }
            exams.forEach(exam => {
                const card = document.createElement('div');
                // 判断是否低于平均值，添加淡红色预警背景
                const belowAvg = isBelowAverage(exam.scores);
                const cardClass = belowAvg 
                    ? 'bg-red-50 border border-red-100 rounded-xl shadow-md p-6 hover:shadow-lg transition-all cursor-pointer transform hover:-translate-y-1 relative'
                    : 'bg-white rounded-xl shadow-md p-6 hover:shadow-lg transition-all cursor-pointer transform hover:-translate-y-1 relative';
                
                card.className = cardClass;
                
                if (isSelecting) {
                    card.classList.add('border-2', selectedExamIds.includes(exam.id) ? 'border-blue-500' : 'border-transparent');
                }
                
                const avgScore = exam.scores.length > 0 ? (exam.scores.reduce((sum, s) => sum + s.value, 0) / exam.scores.length).toFixed(1) : '0';
                const latestDate = exam.scores.length > 0 ? exam.scores[exam.scores.length - 1].date : '无';
                // 计算预测分数
                const predictScore = predictNextScore(exam.scores, exam.fullScore);
                const predictText = predictScore !== null ? `${predictScore} (预测)` : '数据不足';
                const predictClass = predictScore !== null ? 'text-orange-500' : 'text-gray-400';

                // 预警提示文本
                const warningText = belowAvg ? `<p class="text-xs text-red-500 mt-1">⚠️ 最近成绩低于平均值</p>` : '';

                card.innerHTML = `
                    ${isSelecting ? `<div class="absolute top-4 right-4 w-6 h-6 rounded-full border-2 border-gray-300 flex items-center justify-center ${selectedExamIds.includes(exam.id) ? 'bg-blue-500 border-blue-500 text-white' : 'bg-white text-transparent'}" data-id="${exam.id}">✓</div>` : ''}
                    <h3 class="text-lg font-bold text-gray-800 mb-2">${exam.name}</h3>
                    <p class="text-gray-500 text-sm mb-2">学科: ${exam.subject}</p>
                    <p class="text-gray-500 text-sm mb-4">满分: ${exam.fullScore}</p>
                    <div class="flex justify-between items-center">
                        <div>
                            <span class="text-sm font-medium text-blue-600">平均分: ${avgScore}</span>
                            <br>
                            <span class="text-xs text-gray-400">最新: ${latestDate}</span>
                            <br>
                            <span class="text-xs font-medium ${predictClass}">${predictText}</span>
                            ${warningText}
                        </div>
                        <i class="fa fa-chevron-right text-gray-300"></i>
                    </div>
                `;
                if (isSelecting) {
                    card.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const checkbox = card.querySelector('.rounded-full');
                        const id = parseInt(checkbox.dataset.id);
                        if (selectedExamIds.includes(id)) {
                            selectedExamIds = selectedExamIds.filter(item => item !== id);
                            checkbox.className = 'absolute top-4 right-4 w-6 h-6 rounded-full border-2 border-gray-300 flex items-center justify-center bg-white text-transparent';
                            card.classList.remove('border-blue-500');
                            card.classList.add('border-transparent');
                        } else {
                            selectedExamIds.push(id);
                            checkbox.className = 'absolute top-4 right-4 w-6 h-6 rounded-full border-2 border-blue-500 flex items-center justify-center bg-blue-500 text-white';
                            card.classList.remove('border-transparent');
                            card.classList.add('border-blue-500');
                        }
                    });
                } else {
                    card.addEventListener('click', () => goToDetail(exam.id));
                }
                cardsContainer.appendChild(card);
            });
        }

        // 渲染综合卡片
        function renderSynthesizeCards() {
            synthesizeCardsContainer.innerHTML = '';
            if (synthesizeExams.length === 0) {
                synthesizeCardsContainer.innerHTML = '<div class="col-span-full text-center py-10 text-gray-400">暂无综合分析卡片，请点击右上角 "综合考虑" 创建</div>';
                return;
            }
            synthesizeExams.forEach(item => {
                const card = document.createElement('div');
                card.className = 'bg-gradient-to-br from-purple-50 to-indigo-50 rounded-xl shadow-md p-6 hover:shadow-lg transition-all cursor-pointer transform hover:-translate-y-1 border border-purple-100 relative';
                card.innerHTML = `
                    <h3 class="text-lg font-bold text-purple-800 mb-2">${item.name}</h3>
                    <p class="text-gray-500 text-sm mb-4">包含 ${item.ids.length} 个学科</p>
                    <div class="flex justify-between items-center">
                        <span class="text-sm font-medium text-purple-600">综合分析</span>
                        <i class="fa fa-chevron-right text-purple-300"></i>
                    </div>
                `;
                card.addEventListener('click', () => {
                    goToSynthesizeDetail(item.id);
                });
                synthesizeCardsContainer.appendChild(card);
            });
        }

        // 进入详情页
        function goToDetail(id) {
            const exam = exams.find(e => e.id === id);
            if (!exam) return;
            currentExamId = id;
            detailTitle.textContent = exam.name;
            detailFullScore.textContent = exam.fullScore;
            detailLastScore.textContent = exam.scores.length > 0 ? exam.scores[exam.scores.length - 1].value : '--';
            
            // 显示预测分数
            const predictScore = predictNextScore(exam.scores, exam.fullScore);
            detailPredictScore.textContent = predictScore !== null ? `${predictScore} (峰值均值回归+同比增长)` : '需至少3次成绩记录';
            
            renderCharts(exam.scores, exam.fullScore);
            
            homePage.classList.add('hidden');
            detailPage.classList.remove('hidden');
            synthesizeDetailPage.classList.add('hidden');
        }

        // 进入综合详情页
        function goToSynthesizeDetail(id) {
            const item = synthesizeExams.find(e => e.id === id);
            if (!item) {
                console.error('未找到综合分析项', id);
                return;
            }
            currentSynthesizeId = id;
            synthesizeDetailTitle.textContent = item.name;
            
            renderSynthesizeCharts(item.ids);
            
            homePage.classList.add('hidden');
            detailPage.classList.add('hidden');
            synthesizeDetailPage.classList.remove('hidden');
        }

        // 销毁所有图表
        function destroyCharts() {
            Object.keys(chartInstances).forEach(key => {
                if (chartInstances[key]) {
                    chartInstances[key].destroy();
                }
            });
            chartInstances = {};
        }

        // 生成普通图表
        function renderCharts(scores, fullScore) {
            destroyCharts();
            if (scores.length === 0) return;
            
            const labels = scores.map(s => s.date);
            const data = scores.map(s => s.value);
            const avg = scores.reduce((sum, s) => sum + s.value, 0) / scores.length;
            const peaks = scores.filter(s => s.value > avg).map(s => s.value);
            const peakAvg = peaks.length > 0 ? peaks.reduce((sum, val) => sum + val, 0) / peaks.length : avg;
            
            // 成绩折线图 - 新增平均值和峰值均值参考线
            const scoreCtx = document.getElementById('score-chart').getContext('2d');
            chartInstances.score = new Chart(scoreCtx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: '成绩',
                            data: data,
                            borderColor: '#3b82f6',
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            tension: 0.4,
                            fill: true
                        },
                        {
                            label: '整体均值',
                            data: Array(labels.length).fill(avg),
                            borderColor: '#ef4444',
                            borderWidth: 1,
                            borderDash: [5, 5],
                            pointRadius: 0,
                            fill: false
                        },
                        {
                            label: '峰值均值',
                            data: Array(labels.length).fill(peakAvg),
                            borderColor: '#10b981',
                            borderWidth: 1,
                            borderDash: [2, 2],
                            pointRadius: 0,
                            fill: false
                        }
                    ]
                },
                options: {
                    responsive: true,
                    plugins: { 
                        title: { display: true, text: '成绩变化趋势' },
                        tooltip: {
                            mode: 'index',
                            intersect: false
                        }
                    },
                    scales: { 
                        y: { 
                            beginAtZero: true, 
                            max: fullScore,
                            ticks: {
                                stepSize: fullScore / 10
                            }
                        } 
                    }
                }
            });
            
            // 增速折线图
            const speedCtx = document.getElementById('speed-chart').getContext('2d');
            const speedData = [];
            for (let i = 1; i < data.length; i++) speedData.push(data[i] - data[i - 1]);
            chartInstances.speed = new Chart(speedCtx, {
                type: 'line',
                data: {
                    labels: labels.slice(1),
                    datasets: [{
                        label: '分数变化',
                        data: speedData,
                        borderColor: '#10b981',
                        backgroundColor: 'rgba(16, 185, 129, 0.1)',
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { title: { display: true, text: '分数增速分析' } },
                    scales: {
                        y: {
                            ticks: {
                                callback: function(value) {
                                    return value > 0 ? `+${value}` : value;
                                }
                            }
                        }
                    }
                }
            });
        }

        // 生成综合图表
        function renderSynthesizeCharts(ids) {
            destroyCharts();
            const selectedExams = exams.filter(e => ids.includes(e.id));
            if (selectedExams.length === 0) return;

            // 获取所有考试的日期集合，并去重、排序
            const allDates = Array.from(new Set(selectedExams.flatMap(e => e.scores.map(s => s.date)))).sort();
            if (allDates.length === 0) return;

            // 构建数据结构
            const datasets = selectedExams.map(exam => {
                const data = allDates.map(date => {
                    const score = exam.scores.find(s => s.date === date);
                    return score ? score.value : null;
                });
                return {
                    id: exam.id,
                    name: exam.name,
                    subject: exam.subject,
                    fullScore: exam.fullScore,
                    data: data,
                    accuracy: data.map(v => v !== null ? (v / exam.fullScore * 100) : null)
                };
            });

            // 1. 正确率复式折线图
            const accuracyCtx = document.getElementById('accuracy-chart').getContext('2d');
            const accuracyDatasets = datasets.map(ds => ({
                label: ds.subject,
                data: ds.accuracy,
                borderColor: getRandomColor(ds.id),
                backgroundColor: getRandomColor(ds.id, 0.1),
                tension: 0.4
            }));
            chartInstances.accuracy = new Chart(accuracyCtx, {
                type: 'line',
                data: { labels: allDates, datasets: accuracyDatasets },
                options: { responsive: true, plugins: { title: { display: true, text: '正确率 (%)' } }, scales: { y: { min: 0, max: 100 } } }
            });

            // 2. 总分折线图
            const totalScoreCtx = document.getElementById('total-score-chart').getContext('2d');
            const totalData = allDates.map(date => {
                let sum = 0;
                datasets.forEach(ds => {
                    const val = ds.data[allDates.indexOf(date)];
                    if (val !== null) sum += val;
                });
                return sum;
            });
            chartInstances.totalScore = new Chart(totalScoreCtx, {
                type: 'line',
                data: {
                    labels: allDates,
                    datasets: [{
                        label: '总分',
                        data: totalData,
                        borderColor: '#1f2937',
                        backgroundColor: 'rgba(31, 41, 55, 0.1)',
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: { responsive: true, plugins: { title: { display: true, text: '总分变化' } } }
            });

            // 3. 单科增速复式条形图 (计算相邻日期的差值)
            const singleSpeedCtx = document.getElementById('single-speed-bar-chart').getContext('2d');
            const speedLabels = allDates.slice(1);
            const speedDatasets = datasets.map(ds => {
                const speedData = [];
                for (let i = 1; i < allDates.length; i++) {
                    const prev = ds.data[i - 1];
                    const curr = ds.data[i];
                    speedData.push((curr !== null && prev !== null) ? (curr - prev) : null);
                }
                return {
                    label: ds.subject,
                    data: speedData,
                    backgroundColor: getRandomColor(ds.id)
                };
            });
            chartInstances.singleSpeed = new Chart(singleSpeedCtx, {
                type: 'bar',
                data: { labels: speedLabels, datasets: speedDatasets },
                options: { responsive: true, plugins: { title: { display: true, text: '单科分数变化' } }, scales: { x: { stacked: false }, y: { stacked: false } } }
            });

            // 4. 总分增速条形图
            const totalSpeedCtx = document.getElementById('total-speed-bar-chart').getContext('2d');
            const totalSpeedData = [];
            for (let i = 1; i < totalData.length; i++) {
                totalSpeedData.push(totalData[i] - totalData[i - 1]);
            }
            chartInstances.totalSpeed = new Chart(totalSpeedCtx, {
                type: 'bar',
                data: {
                    labels: speedLabels,
                    datasets: [{
                        label: '总分变化',
                        data: totalSpeedData,
                        backgroundColor: '#1f2937'
                    }]
                },
                options: { responsive: true, plugins: { title: { display: true, text: '总分增速' } } }
            });

            // 5. 总分同比增长率条形图
            const totalRatioCtx = document.getElementById('total-ratio-bar-chart').getContext('2d');
            const totalRatioData = [];
            for (let i = 1; i < totalData.length; i++) {
                if (totalData[i - 1] === 0) totalRatioData.push(0);
                else totalRatioData.push(((totalData[i] - totalData[i - 1]) / totalData[i - 1] * 100).toFixed(2));
            }
            chartInstances.totalRatio = new Chart(totalRatioCtx, {
                type: 'bar',
                data: {
                    labels: speedLabels,
                    datasets: [{
                        label: '同比增长率 (%)',
                        data: totalRatioData,
                        backgroundColor: totalRatioData.map(v => v >= 0 ? '#10b981' : '#ef4444')
                    }]
                },
                options: { responsive: true, plugins: { title: { display: true, text: '总分同比增长率' } } }
            });
        }

        // 辅助函数：生成随机颜色
        function getRandomColor(id, alpha = 1) {
            const hash = id.toString().split('').reduce((acc, char) => acc + char.charCodeAt(0), 0);
            const r = (hash & 0xFF0000) >> 16;
            const g = (hash & 0x00FF00) >> 8;
            const b = hash & 0x0000FF;
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        // 事件监听
        addCardBtn.addEventListener('click', () => addModal.classList.remove('hidden'));
        closeModalBtn.addEventListener('click', () => addModal.classList.add('hidden'));
        backBtn.addEventListener('click', () => {
            detailPage.classList.add('hidden');
            homePage.classList.remove('hidden');
        });
        synthesizeBackBtn.addEventListener('click', () => {
            synthesizeDetailPage.classList.add('hidden');
            homePage.classList.remove('hidden');
        });
        addScoreBtn.addEventListener('click', () => scoreModal.classList.remove('hidden'));
        closeScoreModalBtn.addEventListener('click', () => scoreModal.classList.add('hidden'));
        closeSynthesizeNameModalBtn.addEventListener('click', () => synthesizeNameModal.classList.add('hidden'));

        // 排序选择
        sortSelect.addEventListener('change', (e) => {
            sortCards(e.target.value);
            renderCards();
        });

        // 综合考虑按钮
        synthesizeBtn.addEventListener('click', () => {
            if (isSelecting) {
                if (selectedExamIds.length > 0) {
                    synthesizeNameModal.classList.remove('hidden');
                } else {
                    isSelecting = false;
                    selectedExamIds = [];
                    synthesizeBtnText.textContent = '综合考虑';
                    renderCards();
                }
            } else {
                isSelecting = true;
                selectedExamIds = [];
                synthesizeBtnText.textContent = '完成';
                renderCards();
            }
        });

        // 保存综合分析
        saveSynthesizeBtn.addEventListener('click', () => {
            const name = synthesizeName.value.trim();
            if (!name || selectedExamIds.length === 0) return;
            synthesizeExams.push({
                id: Date.now(),
                name: name,
                ids: [...selectedExamIds]
            });
            synthesizeName.value = '';
            synthesizeNameModal.classList.add('hidden');
            isSelecting = false;
            selectedExamIds = [];
            synthesizeBtnText.textContent = '综合考虑';
            saveData();
            renderCards();
            renderSynthesizeCards();
        });

        // 保存考试
        saveCardBtn.addEventListener('click', () => {
            const name = modalName.value.trim();
            const subject = modalSubject.value.trim();
            const fullScore = parseInt(modalFullScore.value);
            if (!name || !subject || isNaN(fullScore) || fullScore <= 0) return;
            
            exams.push({
                id: Date.now(),
                name,
                subject,
                fullScore,
                scores: []
            });
            modalName.value = '';
            modalSubject.value = '';
            modalFullScore.value = '';
            addModal.classList.add('hidden');
            saveData();
            renderCards();
        });

        // 保存成绩
        saveScoreBtn.addEventListener('click', () => {
            const date = scoreDate.value;
            const value = parseInt(scoreValue.value);
            if (!date || isNaN(value) || value < 0) return;
            
            const exam = exams.find(e => e.id === currentExamId);
            if (!exam) return;
            
            exam.scores.push({ date, value });
            exam.scores.sort((a, b) => new Date(a.date) - new Date(b.date));
            
            scoreDate.value = '';
            scoreValue.value = '';
            scoreModal.classList.add('hidden');
            saveData();
            goToDetail(currentExamId);
            renderCards(); // 重新渲染卡片，更新预警状态
        });

        // 导出当前考试数据
        exportDataBtn.addEventListener('click', () => {
            const exam = exams.find(e => e.id === currentExamId);
            if (!exam) return;
            
            const dataStr = JSON.stringify(exam, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${exam.name}_数据.json`;
            a.click();
            URL.revokeObjectURL(url);
        });

        // 导出综合数据
        synthesizeExportDataBtn.addEventListener('click', () => {
            const item = synthesizeExams.find(e => e.id === currentSynthesizeId);
            if (!item) return;
            const data = {
                name: item.name,
                exams: exams.filter(e => item.ids.includes(e.id))
            };
            const dataStr = JSON.stringify(data, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            a.href = url;
            a.download = `${item.name}_综合数据.json`;
            a.click();
            URL.revokeObjectURL(url);
        });

        // 导出图片
        exportImageBtn.addEventListener('click', () => {
            const exam = exams.find(e => e.id === currentExamId);
            if (!exam || !chartInstances.score) return;

            // 创建临时容器
            const tempDiv = document.createElement('div');
            tempDiv.style.width = '100%';
            tempDiv.style.maxWidth = '800px';
            tempDiv.style.margin = '0 auto';
            tempDiv.style.backgroundColor = '#fff';
            tempDiv.style.padding = '20px';
            tempDiv.style.borderRadius = '12px';
            tempDiv.style.boxShadow = '0 4px 12px rgba(0,0,0,0.1)';
            tempDiv.style.position = 'absolute';
            tempDiv.style.top = '-9999px'; // 隐藏在视口外
            document.body.appendChild(tempDiv);

            // 添加标题和信息
            const title = document.createElement('h2');
            title.textContent = exam.name;
            title.style.textAlign = 'center';
            title.style.marginBottom = '20px';
            tempDiv.appendChild(title);
            
            const infoDiv = document.createElement('div');
            infoDiv.style.display = 'flex';
            infoDiv.style.justifyContent = 'space-around';
            infoDiv.style.marginBottom = '20px';
            infoDiv.innerHTML = `
                <div><p>满分: ${exam.fullScore}</p></div>
                <div><p>最近一次成绩: ${exam.scores.length > 0 ? exam.scores[exam.scores.length - 1].value : '--'}</p></div>
                <div><p>预测成绩: ${predictNextScore(exam.scores, exam.fullScore) || '--'}</p></div>
            `;
            tempDiv.appendChild(infoDiv);

            // 克隆并重新绘制成绩图表
            const scoreCanvas = document.createElement('canvas');
            scoreCanvas.width = 800;
            scoreCanvas.height = 400;
            tempDiv.appendChild(scoreCanvas);
            const scoreCtx = scoreCanvas.getContext('2d');
            new Chart(scoreCtx, chartInstances.score.config);

            // 克隆并重新绘制增速图表
            const speedCanvas = document.createElement('canvas');
            speedCanvas.width = 800;
            speedCanvas.height = 400;
            tempDiv.appendChild(speedCanvas);
            const speedCtx = speedCanvas.getContext('2d');
            new Chart(speedCtx, chartInstances.speed.config);

            // 等待图表渲染完成后生成图片
            setTimeout(() => {
                html2canvas(tempDiv, { 
                    scale: 2,
                    useCORS: true,
                    logging: false
                }).then(canvas => {
                    document.body.removeChild(tempDiv);
                    const imgData = canvas.toDataURL('image/png');
                    const a = document.createElement('a');
                    a.href = imgData;
                    a.download = `${exam.name}_分析图.png`;
                    a.click();
                });
            }, 500);
        });

        // 导出综合图片
        synthesizeExportImageBtn.addEventListener('click', () => {
            const item = synthesizeExams.find(e => e.id === currentSynthesizeId);
            if (!item || Object.keys(chartInstances).length === 0) return;

            // 创建临时容器
            const tempDiv = document.createElement('div');
            tempDiv.style.width = '100%';
            tempDiv.style.maxWidth = '1000px';
            tempDiv.style.margin = '0 auto';
            tempDiv.style.backgroundColor = '#fff';
            tempDiv.style.padding = '20px';
            tempDiv.style.borderRadius = '12px';
            tempDiv.style.boxShadow = '0 4px 12px rgba(0,0,0,0.1)';
            tempDiv.style.position = 'absolute';
            tempDiv.style.top = '-9999px';
            document.body.appendChild(tempDiv);

            // 添加标题
            const title = document.createElement('h2');
            title.textContent = item.name;
            title.style.textAlign = 'center';
            title.style.marginBottom = '20px';
            tempDiv.appendChild(title);

            // 图表列表
            const chartList = [
                { id: 'accuracy', title: '正确率复式折线图' },
                { id: 'totalScore', title: '总分折线图' },
                { id: 'singleSpeed', title: '单科增速复式条形图' },
                { id: 'totalSpeed', title: '总分增速条形图' },
                { id: 'totalRatio', title: '总分同比增长率条形图' }
            ];

            // 克隆并重新绘制所有图表
            chartList.forEach(chartInfo => {
                if (!chartInstances[chartInfo.id]) return;

                const chartWrap = document.createElement('div');
                chartWrap.style.marginBottom = '20px';
                tempDiv.appendChild(chartWrap);

                const chartTitle = document.createElement('h3');
                chartTitle.textContent = chartInfo.title;
                chartTitle.style.marginBottom = '10px';
                chartWrap.appendChild(chartTitle);

                const canvas = document.createElement('canvas');
                canvas.width = 900;
                canvas.height = 400;
                chartWrap.appendChild(canvas);

                const ctx = canvas.getContext('2d');
                new Chart(ctx, chartInstances[chartInfo.id].config);
            });

            // 等待渲染完成
            setTimeout(() => {
                html2canvas(tempDiv, {
                    scale: 2,
                    useCORS: true,
                    logging: false
                }).then(canvas => {
                    document.body.removeChild(tempDiv);
                    const imgData = canvas.toDataURL('image/png');
                    const a = document.createElement('a');
                    a.href = imgData;
                    a.download = `${item.name}_综合分析图.png`;
                    a.click();
                });
            }, 800);
        });

        // 导出全部数据
        exportAllBtn.addEventListener('click', () => {
            const data = { exams, synthesizeExams };
            const dataStr = JSON.stringify(data, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = '全部考试数据.json';
            a.click();
            URL.revokeObjectURL(url);
        });

        // 导入数据
        importBtn.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const importedData = JSON.parse(event.target.result);
                    if (importedData.exams) exams = importedData.exams;
                    if (importedData.synthesizeExams) synthesizeExams = importedData.synthesizeExams;
                    saveData();
                    renderCards();
                    renderSynthesizeCards();
                    alert('数据导入成功！');
                } catch (err) {
                    alert('导入失败，请选择有效的 JSON 文件');
                }
            };
            reader.readAsText(file);
        });

        init();
    </script>
</body>
</html>
