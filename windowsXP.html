<html lang="zh-CN"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows XP 模拟器</title>
    <!-- Tailwind CSS v3 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- 统一的 Tailwind 配置 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'xp-blue': '#005EBB',
                        'xp-blue-dark': '#003B73',
                        'xp-green': '#00A86B',
                        'xp-green-dark': '#00704A',
                        'xp-gray': '#E5E5E5',
                        'xp-gray-dark': '#C0C0C0',
                        'xp-text': '#333333',
                        'xp-window': '#FFFFFF',
                        'xp-window-title': '#005EBB',
                        'xp-taskbar': '#C0C0C0',
                        'xp-start-button': '#3256A0',
                        'xp-start-menu': '#E1E1E1',
                        'xp-start-menu-item': '#FFFFFF',
                        'xp-start-menu-item-hover': '#005EBB',
                        // Win7 风格颜色
                        'win7-blue': '#0078D7',
                        'win7-blue-dark': '#005A9E',
                        'win7-gray': '#F2F2F2',
                        'win7-gray-dark': '#E5E5E5',
                        'win7-border': '#D4D4D4',
                        // Win10 命令提示符颜色
                        'win10-cmd-bg': '#0C0C0C',
                        'win10-cmd-text': '#CCCCCC',
                        'win10-cmd-title': '#2D2D30',
                    },
                    fontFamily: {
                        sans: ['Tahoma', 'Microsoft YaHei', 'sans-serif'],
                    },
                    boxShadow: {
                        'xp-window': '2px 2px 0px #000000',
                        'xp-button': '1px 1px 0px #000000',
                        'xp-button-pressed': 'inset 1px 1px 0px #000000',
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-in-out',
                        'slide-up': 'slideUp 0.3s ease-in-out',
                        'slide-down': 'slideDown 0.3s ease-in-out',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(100%)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        },
                        slideDown: {
                            '0%': { transform: 'translateY(-100%)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        },
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">

            }
            .xp-taskbar-button {
                @apply flex items-center px-2 py-1 bg-xp-gray border-t border-l border-r border-gray-400 text-sm hover:bg-xp-gray-dark cursor-pointer;
            }
            .xp-taskbar-button-active {
                @apply bg-white border-t-2 border-l-2 border-r-2 border-blue-500;
            }
            .win10-cmd-bg {
                @apply bg-win10-cmd-bg text-win10-cmd-text;
            }

                @apply bg-win10-cmd-title text-white;
            }

    </style>
    <style>
        body {
            overflow: hidden;
            font-family: 'Tahoma', 'Microsoft YaHei', sans-serif;
            cursor: default;
        }
        
        /* 右键菜单样式 */
        .context-menu {
            position: absolute;
            background-color: #F0F0F0;
            border: 1px solid #000;
            box-shadow: 2px 2px 0px #000000;
            padding: 2px;
            z-index: 1000;
            display: none;
        }
        
        .context-menu-item {
            padding: 3px 20px 3px 10px;
            cursor: pointer;
            white-space: nowrap;
        }
        
        .context-menu-item:hover {
            background-color: #005EBB;
            color: white;
        }
        
        .context-menu-separator {
            height: 1px;
            background-color: #808080;
            margin: 2px 0;
        }
        
        .desktop {
            background-image: url('https://p26-doubao-search-sign.byteimg.com/labis/58cf1827922715826bae3f2392778ff6~tplv-be4g95zd3a-image.jpeg?rk3s=542c0f93&x-expires=1777870810&x-signature=7rdg%2BQ5JhcWMWHB4FUknjv0HJJ0%3D');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        
        .window {
            position: absolute;
            z-index: 10;
            box-shadow: 2px 2px 0px #000000;
            transition: all 0.2s ease;
        }
        
        .window.maximized {
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: calc(100% - 40px) !important;
        }
        
        .window-content {
            overflow: auto;
        }
        
        .start-menu {
            position: absolute;
            bottom: 40px;
            left: 0;
            z-index: 100;
            width: 300px;
            height: 400px;
            display: none;
            animation: slideUp 0.3s ease-in-out;
        }
        
        .start-button {
            background: linear-gradient(to bottom, #5B9BD5, #3660A5);
            border: 1px solid #000;
            color: white;
            font-weight: bold;
            display: flex;
            align-items: center;
            padding: 0 10px;
            height: 30px;
        }
        
        .start-button:hover {
            background: linear-gradient(to bottom, #7CB9E8, #4F81BD);
        }
        
        .start-button:active {
            background: linear-gradient(to bottom, #3660A5, #5B9BD5);
        }
        
        .wallpaper-selector {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        
        .wallpaper-option {
            width: 100%;
            height: 100px;
            background-size: cover;
            background-position: center;
            cursor: pointer;
            border: 2px solid transparent;
        }
        
        .wallpaper-option:hover {
            border: 2px solid #005EBB;
        }
        
        .wallpaper-option.selected {
            border: 2px solid #005EBB;
        }
        
        /* 自定义滚动条 */
        ::-webkit-scrollbar {
            width: 16px;
            height: 16px;
        }
        
        ::-webkit-scrollbar-track {
            background-color: #E5E5E5;
            border: 1px solid #C0C0C0;
        }
        
        ::-webkit-scrollbar-thumb {
            background-color: #C0C0C0;
            border: 1px solid #808080;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background-color: #A0A0A0;
        }
        
        /* 窗口拖拽相关 */
        .window-dragging {
            z-index: 1000 !important;
        }
        
        /* 开始菜单动画 */
        @keyframes slideUp {
            from {
                transform: translateY(100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        /* 窗口淡入动画 */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        
        .window {
            animation: fadeIn 0.3s ease-in-out;
        }
    </style>
</head>

    <script>
        // 全局变量
        let windows = [];
        let activeWindowId = null;
        let nextWindowId = 1;
        let draggedWindow = null;
        let dragOffsetX = 0;
        let dragOffsetY = 0;
        let isStartMenuOpen = false;
        let userApps = [];
        let currentTheme = 'xp'; // 'xp' 或 'win7'
        let desktopItems = []; // 桌面项目列表
        let selectedWallpaper = null; // 当前选中的壁纸
        
        // 文件系统
        let fileSystem = {
            'C:': {
                name: 'C:',
                type: 'drive',
                path: '',
                content: [
                    {
                        id: 'c-windows',
                        name: 'Windows',
                        type: 'folder',
                        path: 'C:\\',
                        content: []
                    },
                    {
                        id: 'c-program-files',
                        name: 'Program Files',
                        type: 'folder',
                        path: 'C:\\',
                        content: []
                    }
                ]
            },
            'D:': {
                name: 'D:',
                type: 'drive',
                path: '',
                content: [
                    {
                        id: 'd-documents',
                        name: '我的文档',
                        type: 'folder',
                        path: 'D:\\',
                        content: [
                            {
                                id: 'd-documents-pictures',
                                name: '图片收藏',
                                type: 'folder',
                                path: 'D:\\我的文档\\',
                                content: []
                            },
                            {
                                id: 'd-documents-music',
                                name: '我的音乐',
                                type: 'folder',
                                path: 'D:\\我的文档\\',
                                content: []
                            },
                            {
                                id: 'd-documents-videos',
                                name: '我的视频',
                                type: 'folder',
                                path: 'D:\\我的文档\\',
                                content: []
                            },
                            {
                                id: 'd-documents-file1',
                                name: '文档1.txt',
                                type: 'file',
                                extension: 'txt',
                                path: 'D:\\我的文档\\',
                                content: '这是一个示例文档。'
                            },
                            {
                                id: 'd-documents-file2',
                                name: '报告.doc',
                                type: 'file',
                                extension: 'doc',
                                path: 'D:\\我的文档\\',
                                content: ''
                            }
                        ]
                    }
                ]
            }
        };
        
        // 当前浏览的文件夹
        let currentFolder = null;
        
        // 壁纸列表
        const wallpapers = [
            'https://p26-doubao-search-sign.byteimg.com/labis/58cf1827922715826bae3f2392778ff6~tplv-be4g95zd3a-image.jpeg?rk3s=542c0f93&x-expires=1777870810&x-signature=7rdg%2BQ5JhcWMWHB4FUknjv0HJJ0%3D',
            'https://p26-doubao-search-sign.byteimg.com/labis/755b1fce3a7c4c1a54986f81e28bba3d~tplv-be4g95zd3a-image.jpeg?rk3s=542c0f93&x-expires=1777870810&x-signature=B2RwIwGPE%2Fb6xdjPcQwAV6EigIo%3D',
            'https://p26-doubao-search-sign.byteimg.com/labis/d1d1838e490a8a996f717164241148ed~tplv-be4g95zd3a-image.jpeg?rk3s=542c0f93&x-expires=1777870810&x-signature=NZ%2FAofq9c9s7Wzyc%2FBD2NFRN8j0%3D',
            'https://p11-doubao-search-sign.byteimg.com/labis/image/ea1f0bc29ce8b72302a748254a606044~tplv-be4g95zd3a-image.jpeg?rk3s=542c0f93&x-expires=1777870810&x-signature=VcnjmVg80serGM%2BzD1mUIqbtwDU%3D'
        ];
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            // 初始化选中的壁纸
            selectedWallpaper = wallpapers[0];
            
            // 加载保存的数据
            loadUserData();
            
            // 设置系统时间
            updateSystemTime();
            setInterval(updateSystemTime, 60000);
            
            // 点击桌面空白处关闭开始菜单和所有窗口的上下文菜单
            document.getElementById('desktop').addEventListener('click', (e) => {
                if (e.target === document.getElementById('desktop')) {
                    closeStartMenu();
                    closeContextMenu();
                }
            });
            
            // 点击任务栏空白处关闭开始菜单
            document.getElementById('taskbar').addEventListener('click', (e) => {
                if (e.target === document.getElementById('taskbar')) {
                    closeStartMenu();
                    closeContextMenu();
                }
            });
            
            // 点击窗口外部关闭开始菜单
            document.addEventListener('click', (e) => {
                if (!document.getElementById('start-menu').contains(e.target) && 
                    !document.getElementById('start-button').contains(e.target)) {
                    closeStartMenu();
                }
                
                // 点击右键菜单外部关闭右键菜单
                if (!document.getElementById('context-menu').contains(e.target)) {
                    closeContextMenu();
                }
            });
            
            // 桌面右键菜单
            document.getElementById('desktop').addEventListener('contextmenu', (e) => {
                e.preventDefault();
                showContextMenu(e.clientX, e.clientY);
            });
            
            // 初始化桌面项目
            initDesktopItems();
        });
        
        // 加载用户数据
        function loadUserData() {
            try {
                // 加载用户应用
                const savedApps = localStorage.getItem('windowsXPSimulator_userApps');
                if (savedApps) {
                    userApps = JSON.parse(savedApps);
                    // 添加用户应用到桌面
                    userApps.forEach(app => {
                        addAppToDesktop(app);
                    });
                }
                
                // 加载主题设置
                const savedTheme = localStorage.getItem('windowsXPSimulator_theme');
                if (savedTheme) {
                    currentTheme = savedTheme;
                    applyTheme(currentTheme);
                }
                
                // 加载壁纸设置
                const savedWallpaper = localStorage.getItem('windowsXPSimulator_wallpaper');
                if (savedWallpaper) {
                    document.querySelector('.desktop').style.backgroundImage = `url('${savedWallpaper}')`;
                    selectedWallpaper = savedWallpaper;
                }
                
                // 加载桌面项目
                const savedItems = localStorage.getItem('windowsXPSimulator_desktopItems');
                if (savedItems) {
                    desktopItems = JSON.parse(savedItems);
                }
            } catch (error) {
                console.error('加载用户数据时出错:', error);
                // 重置数据
                userApps = [];
                currentTheme = 'xp';
                selectedWallpaper = wallpapers[0];
                desktopItems = [];
            }
        }

            try {
                localStorage.setItem('windowsXPSimulator_userApps', JSON.stringify(userApps));
                localStorage.setItem('windowsXPSimulator_theme', currentTheme);
                localStorage.setItem('windowsXPSimulator_wallpaper', selectedWallpaper);
                localStorage.setItem('windowsXPSimulator_desktopItems', JSON.stringify(desktopItems));
            } catch (error) {
                console.error('保存用户数据时出错:', error);
            }
        }

        // 导入应用
        function importApp() {
            const fileInput = document.querySelector('#app-file-input');
            const nameInput = document.querySelector('#app-name-input');
            const iconSelect = document.querySelector('#app-icon-select');
            
            if (!fileInput || !nameInput || !iconSelect) {
                alert('无法获取必要的元素');
                return;
            }
            
            const file = fileInput.files[0];
            const name = nameInput.value.trim();
            const icon = iconSelect.value;
            
            if (!file) {
                alert('请选择一个 HTML 文件');
                return;
            }
            
            if (!name) {
                alert('请输入应用名称');
                return;
            }
            
            const reader = new FileReader();
            reader.onload = (e) => {
                const content = e.target.result;
                
                // 创建应用对象
                const app = {
                    id: Date.now().toString(),
                    name: name,
                    icon: icon,
                    content: content,
                    created: new Date().toISOString()
                };
                
                // 添加到用户应用列表
                userApps.push(app);
                
                // 添加到桌面
                addAppToDesktop(app);
                
                // 保存数据
                saveUserData();
                
                alert(`应用 "${name}" 已成功导入！`);
                
                // 关闭应用导入器窗口
                closeCurrentWindow();
            };
            
            reader.readAsText(file);
        }

        // 创建窗口
        function createWindow(title, content, width = 600, height = 400, x = null, y = null) {
            // 生成唯一ID
            const id = nextWindowId++;
            
            // 创建窗口元素
            const windowElement = document.createElement('div');
            windowElement.className = 'window bg-xp-window border-2 border-black';
            windowElement.id = `window-${id}`;
            windowElement.style.width = `${width}px`;
            windowElement.style.height = `${height}px`;
            
            // 如果没有指定位置，则随机放置
            if (x === null || y === null) {
                const desktopWidth = document.getElementById('desktop').offsetWidth;
                const desktopHeight = document.getElementById('desktop').offsetHeight;
                x = Math.random() * (desktopWidth - width - 40) + 20;
                y = Math.random() * (desktopHeight - height - 100) + 20;
            }
            
            windowElement.style.left = `${x}px`;
            windowElement.style.top = `${y}px`;
            
            // 创建窗口标题栏
            const titlebar = document.createElement('div');
            // 如果是命令提示符，使用Win10风格的标题栏
            if (title === '命令提示符') {
                titlebar.className = 'xp-window-titlebar win10-cmd-titlebar';
            } else {
                titlebar.className = 'xp-window-titlebar';
            }
            titlebar.innerHTML = `
                <div class="flex items-center">
                    <i class="fa fa-window-maximize mr-2"></i>
                    <span>${title}</span>
                </div>
                <div class="flex items-center gap-1">
                    <button class="xp-button h-6 w-6 p-0" onclick="minimizeWindow(${id})">
                        <i class="fa fa-minus"></i>
                    </button>
                    <button class="xp-button h-6 w-6 p-0" onclick="maximizeWindow(${id})">
                        <i class="fa fa-square-o"></i>
                    </button>
                    <button class="xp-button h-6 w-6 p-0" onclick="closeWindow(${id})">
                        <i class="fa fa-times"></i>
                    </button>
                </div>
            `;
            
            // 创建窗口内容区
            const contentArea = document.createElement('div');
            contentArea.className = 'window-content h-[calc(100%-24px)] overflow-auto';
            contentArea.innerHTML = content;
            
            // 组装窗口
            windowElement.appendChild(titlebar);
            windowElement.appendChild(contentArea);
            
            // 添加到桌面
            document.getElementById('desktop').appendChild(windowElement);
            
            // 添加到窗口列表
            windows.push({
                id,
                title,
                element: windowElement,
                isMaximized: false,
                originalSize: { width, height },
                originalPosition: { x, y }
            });
            
            // 创建任务按钮
            createTaskButton(id, title);
            
            // 激活窗口
            activateWindow(id);
            
            // 添加拖拽事件
            setupDragEvents(windowElement, id);
            
            return id;
        }
        
        // 设置窗口拖拽事件
        function setupDragEvents(windowElement, id) {
            const titlebar = windowElement.querySelector('.xp-window-titlebar');
            if (!titlebar) return;
            
            titlebar.addEventListener('mousedown', (e) => {
                // 激活窗口
                activateWindow(id);
                
                // 如果点击的是按钮，不启动拖拽
                if (e.target.closest('button')) {
                    return;
                }
                
                // 启动拖拽
                draggedWindow = id;
                const windowObj = windows.find(w => w.id === id);
                
                if (windowObj && !windowObj.isMaximized) {
                    const rect = windowElement.getBoundingClientRect();
                    dragOffsetX = e.clientX - rect.left;
                    dragOffsetY = e.clientY - rect.top;
                    
                    windowElement.classList.add('window-dragging');
                    
                    // 添加全局事件监听
                    document.addEventListener('mousemove', dragWindow);
                    document.addEventListener('mouseup', stopDragWindow);
                }
                
                e.preventDefault();
            });
        }
        
        // 拖拽窗口
        function dragWindow(e) {
            if (draggedWindow === null) return;
            
            const windowObj = windows.find(w => w.id === draggedWindow);
            if (!windowObj || windowObj.isMaximized) return;
            
            const windowElement = windowObj.element;
            const desktopRect = document.getElementById('desktop').getBoundingClientRect();
            
            let newLeft = e.clientX - dragOffsetX - desktopRect.left;
            let newTop = e.clientY - dragOffsetY - desktopRect.top;
            
            // 限制窗口不超出桌面边界
            newLeft = Math.max(0, Math.min(newLeft, desktopRect.width - windowElement.offsetWidth));
            newTop = Math.max(0, Math.min(newTop, desktopRect.height - windowElement.offsetHeight - 40));
            
            windowElement.style.left = `${newLeft}px`;
            windowElement.style.top = `${newTop}px`;
            
            // 更新原始位置
            windowObj.originalPosition = { x: newLeft, y: newTop };
        }
        
        // 停止拖拽窗口
        function stopDragWindow() {
            if (draggedWindow !== null) {
                const windowElement = windows.find(w => w.id === draggedWindow)?.element;
                if (windowElement) {
                    windowElement.classList.remove('window-dragging');
                }
                draggedWindow = null;
                
                // 移除全局事件监听
                document.removeEventListener('mousemove', dragWindow);
                document.removeEventListener('mouseup', stopDragWindow);
            }
        }
        
        // 创建任务按钮
        function createTaskButton(windowId, title) {
            const taskButtonsContainer = document.getElementById('task-buttons');
            if (!taskButtonsContainer) return;
            
            const taskButton = document.createElement('div');
            taskButton.className = 'xp-taskbar-button';
            taskButton.id = `task-button-${windowId}`;
            taskButton.innerHTML = `
                <i class="fa fa-window-maximize mr-1"></i>
                <span>${title}</span>
            `;
            
            taskButton.addEventListener('click', () => {
                const windowObj = windows.find(w => w.id === windowId);
                if (windowObj) {
                    if (windowObj.id === activeWindowId) {
                        minimizeWindow(windowId);
                    } else {
                        activateWindow(windowId);
                    }
                }
            });
            
            taskButtonsContainer.appendChild(taskButton);
        }
        
        // 激活窗口
        function activateWindow(windowId) {
            // 找到窗口
            const windowObj = windows.find(w => w.id === windowId);
            if (!windowObj) return;
            
            // 取消当前激活窗口的激活状态
            if (activeWindowId !== null) {
                const activeWindowObj = windows.find(w => w.id === activeWindowId);
                if (activeWindowObj) {
                    activeWindowObj.element.style.zIndex = 10;
                    const activeTaskButton = document.getElementById(`task-button-${activeWindowId}`);
                    if (activeTaskButton) {
                        activeTaskButton.classList.remove('xp-taskbar-button-active');
                    }
                }
            }
            
            // 设置新的激活窗口
            activeWindowId = windowId;
            windowObj.element.style.zIndex = 100;
            
            // 更新任务按钮状态
            const taskButton = document.getElementById(`task-button-${windowId}`);
            if (taskButton) {
                taskButton.classList.add('xp-taskbar-button-active');
            }
        }
        
        // 最小化窗口
        function minimizeWindow(windowId) {
            const windowObj = windows.find(w => w.id === windowId);
            if (!windowObj) return;
            
            windowObj.element.style.display = 'none';
            
            // 如果最小化的是当前激活窗口，取消激活状态
            if (windowId === activeWindowId) {
                activeWindowId = null;
                
                // 更新任务按钮状态
                const taskButton = document.getElementById(`task-button-${windowId}`);
                if (taskButton) {

        // 最大化窗口
        function maximizeWindow(windowId) {
            const windowObj = windows.find(w => w.id === windowId);
            if (!windowObj) return;
            
            const windowElement = windowObj.element;
            const desktopRect = document.getElementById('desktop').getBoundingClientRect();
            
            if (!windowObj.isMaximized) {
                // 保存原始大小和位置
                windowObj.originalSize = {
                    width: windowElement.offsetWidth,
                    height: windowElement.offsetHeight
                };
                
                windowObj.originalPosition = {
                    x: parseInt(windowElement.style.left),
                    y: parseInt(windowElement.style.top)
                };
                
                // 最大化窗口
                windowElement.classList.add('maximized');
                windowObj.isMaximized = true;
                
                // 更新最大化按钮图标
                const maximizeButton = windowElement.querySelector('.xp-window-titlebar button:nth-child(2)');
                if (maximizeButton) {
                    maximizeButton.innerHTML = '<i class="fa fa-square"></i>';
                }
            } else {
                // 恢复窗口大小和位置
                windowElement.classList.remove('maximized');
                windowElement.style.width = `${windowObj.originalSize.width}px`;
                windowElement.style.height = `${windowObj.originalSize.height}px`;
                windowElement.style.left = `${windowObj.originalPosition.x}px`;
                windowElement.style.top = `${windowObj.originalPosition.y}px`;
                windowObj.isMaximized = false;
                
                // 更新最大化按钮图标
                const maximizeButton = windowElement.querySelector('.xp-window-titlebar button:nth-child(2)');
                if (maximizeButton) {
                    maximizeButton.innerHTML = '<i class="fa fa-square-o"></i>';
                }
            }
        }
        
        // 关闭窗口
        function closeWindow(windowId) {
            // 找到窗口索引
            const windowIndex = windows.findIndex(w => w.id === windowId);
            if (windowIndex === -1) return;
            
            // 移除窗口元素
            const windowElement = windows[windowIndex].element;
            windowElement.remove();
            
            // 移除任务按钮
            const taskButton = document.getElementById(`task-button-${windowId}`);
            if (taskButton) {
                taskButton.remove();
            }
            
            // 如果关闭的是当前激活窗口，取消激活状态
            if (windowId === activeWindowId) {
                activeWindowId = null;
                
                // 激活其他窗口
                if (windows.length > 1) {
                    const newActiveWindow = windows[windowIndex === 0 ? 1 : windowIndex - 1];
                    activateWindow(newActiveWindow.id);
                }
            }
            
            // 从窗口列表中移除
            windows.splice(windowIndex, 1);
        }

        // 保存记事本内容

            const windowElement = button.closest('.window');

            const content = textarea.value;
            
            if (content.trim() === '') {
                alert('请先输入内容再保存');

            // 创建Blob对象
            const blob = new Blob([content], { type: 'text/plain' });

            // 在文件系统中查找文件夹
            const folder = findItemById(folderId);
            if (!folder || folder.type !== 'folder') return;
            
            // 设置当前浏览的文件夹
            currentFolder = folder;
            
            // 更新窗口内容
            const windowObj = windows.find(w => w.title === currentFolder.name || w.title === '我的文档' || w.title === '此电脑');
            if (windowObj) {
                windowObj.title = folder.name;
                windowObj.element.querySelector('.xp-window-titlebar span').textContent = folder.name;
                windowObj.element.querySelector('.window-content').innerHTML = createFileExplorerContent(folder);

        // 根据ID查找文件系统中的项目
        function findItemById(id) {
            // 递归查找函数
            function searchInFolder(folder) {
                for (const item of folder.content) {
                    if (item.id === id) {
                        return item;
                    }
                    if (item.type === 'folder' && item.content) {
                        const result = searchInFolder(item);
                        if (result) return result;
                    }
                }
                return null;
            }
            
            // 搜索所有驱动器
            for (const driveKey in fileSystem) {
                const drive = fileSystem[driveKey];
                const result = searchInFolder(drive);
                if (result) return result;
            }
            
            return null;

        // 导航到指定路径
        function navigateToPath(path) {
            if (!path) {
                // 导航到根目录（此电脑）
                openMyComputer();
                return;
            }
            
            // 解析路径
            const pathParts = path.split('\\').filter(Boolean);
            if (pathParts.length === 0) return;
            
            // 找到对应的文件夹
            let currentItem = fileSystem[pathParts[0]];
            if (!currentItem) return;
            
            for (let i = 1; i < pathParts.length; i++) {
                const part = pathParts[i];
                const nextItem = currentItem.content.find(item => item.name === part);
                if (!nextItem || nextItem.type !== 'folder') return;
                currentItem = nextItem;
            }
            
            if (currentItem.type === 'folder') {
                openFolderById(currentItem.id);
            }
        }

        // 拖动开始
        function drag(ev) {
            ev.dataTransfer.setData("text", ev.target.dataset.id);
        }
        
        // 放置
        function drop(ev) {
            ev.preventDefault();
            const data = ev.dataTransfer.getData("text");
            const draggedItem = findItemById(data);
            
            if (!draggedItem) return;
            
            // 检查是否拖到了回收站
            const targetElement = ev.target.closest('.xp-desktop-icon');
            if (targetElement && targetElement.querySelector('.fa-trash')) {
                // 删除项目
                deleteItem(draggedItem);
                return;
            }
            
            // 检查是否拖到了文件夹窗口
            if (currentFolder) {
                // 找到拖动项的原始父文件夹
                const originalParent = findParentFolder(draggedItem);
                if (originalParent && originalParent !== currentFolder) {
                    // 从原始父文件夹中移除
                    const index = originalParent.content.findIndex(item => item.id === draggedItem.id);
                    if (index > -1) {
                        originalParent.content.splice(index, 1);
                        
                        // 添加到新文件夹
                        draggedItem.path = currentFolder.path + currentFolder.name + '\\';
                        currentFolder.content.push(draggedItem);
                        
                        // 更新窗口内容
                        const windowObj = windows.find(w => w.title === currentFolder.name);
                        if (windowObj) {
                            windowObj.element.querySelector('.window-content').innerHTML = createFileExplorerContent(currentFolder);
                        }
                        
                        // 如果是从桌面拖到文件夹，更新桌面图标
                        const desktopIcon = document.querySelector(`[data-id="${draggedItem.id}"]`);
                        if (desktopIcon) {
                            desktopIcon.remove();
                        }
                    }
                }
            }
        }
        
        // 删除项目
        function deleteItem(item) {
            if (confirm(`确定要删除 ${item.name} 吗？`)) {
                const parent = findParentFolder(item);
                if (parent) {
                    const index = parent.content.findIndex(i => i.id === item.id);
                    if (index > -1) {
                        parent.content.splice(index, 1);
                        
                        // 更新窗口内容
                        const windowObj = windows.find(w => w.title === parent.name);
                        if (windowObj) {
                            windowObj.element.querySelector('.window-content').innerHTML = createFileExplorerContent(parent);
                        }
                        
                        // 更新桌面图标
                        const desktopIcon = document.querySelector(`[data-id="${item.id}"]`);
                        if (desktopIcon) {

                        }
                    }
                }

        }

                    if (contentItem.id === item.id) {

                        const result = searchInFolder(contentItem);

            for (const driveKey in fileSystem) {

        // 计算器显示
        let calcDisplay = '0';
        let calcOperator = null;
        let calcFirstOperand = null;
        let calcWaitingForSecondOperand = false;
        
        // 计算器按钮点击
        function calcButtonClick(value) {
            const display = document.getElementById('calc-display');
            
            if (value >= '0' && value <= '9') {
                if (calcWaitingForSecondOperand) {
                    calcDisplay = value;
                    calcWaitingForSecondOperand = false;
                } else {
                    calcDisplay = calcDisplay === '0' ? value : calcDisplay + value;
                }
            } else if (value === '.') {
                if (calcWaitingForSecondOperand) {
                    calcDisplay = '0.';
                    calcWaitingForSecondOperand = false;
                } else if (calcDisplay.indexOf('.') === -1) {
                    calcDisplay += '.';
                }
            } else if (value === '+' || value === '-' || value === '*' || value === '/') {
                const inputValue = parseFloat(calcDisplay);
                
                if (calcFirstOperand === null) {
                    calcFirstOperand = inputValue;
                } else if (calcOperator) {
                    const result = calculate(calcFirstOperand, inputValue, calcOperator);
                    
                    calcDisplay = String(result);
                    calcFirstOperand = result;
                }
                
                calcWaitingForSecondOperand = true;
                calcOperator = value;
            } else if (value === '=') {
                const inputValue = parseFloat(calcDisplay);
                
                if (calcFirstOperand !== null && calcOperator && !calcWaitingForSecondOperand) {
                    const result = calculate(calcFirstOperand, inputValue, calcOperator);
                    
                    calcDisplay = String(result);
                    calcFirstOperand = null;
                    calcOperator = null;
                    calcWaitingForSecondOperand = false;
                }
            }
            
            display.textContent = calcDisplay;
        }
        
        // 计算器计算
        function calculate(firstOperand, secondOperand, operator) {
            if (operator === '+') {
                return firstOperand + secondOperand;
            } else if (operator === '-') {
                return firstOperand - secondOperand;
            } else if (operator === '*') {
                return firstOperand * secondOperand;
            } else if (operator === '/') {
                return firstOperand / secondOperand;
            }
            
            return secondOperand;
        }

                        </div>

            `;
            
            const windowId = createWindow('画图', content, 900, 600);
            
            // 初始化画布
            const canvas = document.querySelector(`#window-${windowId} #paint-canvas`);
            if (canvas) {
                const ctx = canvas.getContext('2d');
                canvas.width = canvas.offsetWidth;
                canvas.height = canvas.offsetHeight;
                
                // 设置默认样式
                ctx.strokeStyle = 'black';
                ctx.lineWidth = 1;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                
                let isDrawing = false;
                let lastX = 0;
                let lastY = 0;
                
                // 鼠标按下事件
                canvas.addEventListener('mousedown', (e) => {
                    isDrawing = true;
                    [lastX, lastY] = [e.offsetX, e.offsetY];
                });
                
                // 鼠标移动事件
                canvas.addEventListener('mousemove', (e) => {
                    if (!isDrawing) return;
                    
                    ctx.beginPath();
                    ctx.moveTo(lastX, lastY);
                    ctx.lineTo(e.offsetX, e.offsetY);
                    ctx.stroke();
                    
                    [lastX, lastY] = [e.offsetX, e.offsetY];
                });
                
                // 鼠标抬起事件
                canvas.addEventListener('mouseup', () => {
                    isDrawing = false;
                });
                
                // 鼠标离开事件
                canvas.addEventListener('mouseout', () => {
                    isDrawing = false;
                });
            }
        }

        // 保存便签
        function saveStickyNote(button) {
            const windowElement = button.closest('.window');
            const textarea = windowElement.querySelector('textarea');
            const content = textarea.value;
            
            if (content.trim() === '') {
                alert('请先输入便签内容再保存');
                return;
            }
            
            // 创建Blob对象
            const blob = new Blob([content], { type: 'text/plain' });
            
            // 创建下载链接
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = '便签.txt';
            a.click();
            
            // 释放URL对象
            URL.revokeObjectURL(a.href);
            
            alert('便签已保存');
        }

        // 关闭计算机
        function shutdown() {
            const shutdownDialog = document.createElement('div');
            shutdownDialog.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50';
            shutdownDialog.id = 'shutdown-dialog';
            
            shutdownDialog.innerHTML = `
                <div class="bg-white rounded-lg shadow-2xl w-80 p-6">
                    <div class="text-center mb-6">
                        <div class="w-16 h-16 mx-auto bg-blue-600 rounded-full flex items-center justify-center text-white text-3xl mb-4">

                            <span class="text-sm">关机</span>
                        </button>
                        <button class="flex flex-col items-center p-3 hover:bg-blue-50 rounded" onclick="restartComputer()">
                            <i class="fa fa-refresh text-blue-500 text-2xl mb-2"></i>
                            <span class="text-sm">重启</span>
                        </button>
                        <button class="flex flex-col items-center p-3 hover:bg-blue-50 rounded" onclick="lockScreen()">
                            <i class="fa fa-lock text-green-500 text-2xl mb-2"></i>

                        </button>
                        <button class="flex flex-col items-center p-3 hover:bg-blue-50 rounded" onclick="sleep()">
                            <i class="fa fa-moon-o text-purple-500 text-2xl mb-2"></i>
                            <span class="text-sm">睡眠</span>
                        </button>
                        <button class="flex flex-col items-center p-3 hover:bg-blue-50 rounded" onclick="cancelShutdown()">
                            <i class="fa fa-times text-gray-500 text-2xl mb-2"></i>
                            <span class="text-sm">取消</span>
                        </button>
                    </div>
                </div>
            `;
            
            document.body.appendChild(shutdownDialog);
        }
        
        // 关机
        function shutdownComputer() {
            const dialog = document.getElementById('shutdown-dialog');
            if (dialog) dialog.remove();
            
            alert('正在关闭计算机...');
            setTimeout(() => {
                document.body.innerHTML = '<div class="flex items-center justify-center h-screen bg-black text-white text-2xl">计算机已关闭</div>';
            }, 2000);
        }
        
        // 重启
        function restartComputer() {
            const dialog = document.getElementById('shutdown-dialog');
            if (dialog) dialog.remove();
            
            alert('正在重启计算机...');
            setTimeout(() => {
                window.location.reload();
            }, 2000);
        }
        
        // 取消关机
        function cancelShutdown() {
            const dialog = document.getElementById('shutdown-dialog');
            if (dialog) dialog.remove();
        }
