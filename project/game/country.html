<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>国家生存模拟器（带图表导出功能）</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- 引入FileSaver.js用于用于文件下载 -->
    <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
    <style>
        /* 原有样式保持不变 */
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
            background-color: #f8f9fa;
        }
        .container {
            max-width: 1600px;
            margin: 0 auto;
        }
        .collapse-message {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #ff4444;
            color: white;
            padding: 30px;
            border-radius: 10px;
            font-size: 24px;
            z-index: 1000;
            text-align: center;
        }
        .params {
            background-color: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .param-group {
            margin: 10px 0;
        }
        label {
            display: inline-block;
            width: 200px;
            font-weight: 500;
        }
        input {
            width: 120px;
            padding: 6px;
        }
        .controls {
            text-align: center;
            margin: 20px 0;
        }
        button {
            padding: 8px 16px;
            margin: 0 8px;
            font-size: 15px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background-color: #4CAF50;
            color: white;
            transition: all 0.3s;
        }
        button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .policy-btn {
            background-color: #ff9800;
        }
        .export-btn {
            background-color: #2196F3;
        }
        #immigrationBtn.active, #birthControlBtn.active, #encourageBirthBtn.active {
            background-color: #2196F3;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin: 20px 0;
            padding: 15px;
            background-color: #f9f9f9;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .stat-item {
            padding: 5px;
        }
        .charts-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        canvas {
            width: 100%;
            height: 300px;
            border: 1px solid #eee;
            border-radius: 4px;
            background-color: white;
        }
        .section-title {
            grid-column: 1 / -1;
            margin: 10px 0;
            color: #333;
            padding-bottom: 5px;
            border-bottom: 1px solid #ddd;
        }
        .policy-section {
            background-color: #fff3e0;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
        }
        .export-progress {
            margin: 10px auto;
            text-align: center;
            color: #666;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="collapse-message" id="collapseMsg">
        <h2>国家崩溃!</h2>
        <p id="collapseReason"></p>
        <button onclick="resetSimulation()">重新开始</button>
    </div>
    
    <div class="container">
        <h1>国家生存模拟器（均匀出生分布）</h1>
        
        <div class="params">
            <!-- 参数区域保持不变 -->
            <div class="section-title">
                <h3>基础人口参数</h3>
            </div>
            <div class="param-group">
                <label>初始人口:</label>
                <input type="number" id="initialPopulation" value="500" min="10">
            </div>
            <div class="param-group">
                <label>基准年出生人数:</label>
                <input type="number" id="baseBirthsPerYear" value="40" min="0" max="200">
            </div>
            <div class="param-group">
                <label>移民速率(人/年):</label>
                <input type="number" id="immigrationRate" value="10" min="0" max="50">
            </div>
            <div class="param-group">
                <label>人均寿命范围(年):</label>
                <input type="number" id="minLifeSpan" value="60" min="20">
                <span>至</span>
                <input type="number" id="maxLifeSpan" value="80" min="21">
            </div>
            
            <div class="section-title policy-section">
                <h3>生育政策参数</h3>
            </div>
            <div class="param-group">
                <label>控制生育调节量:</label>
                <input type="number" id="birthControlAmount" value="10" min="1" max="50">
                <span>(减少的年出生人数)</span>
            </div>
            <div class="param-group">
                <label>鼓励生育调节量:</label>
                <input type="number" id="encourageBirthAmount" value="10" min="1" max="50">
                <span>(增加的年出生人数)</span>
            </div>
            <div class="param-group">
                <label>政策跟随概率(%):</label>
                <input type="number" id="policyFollowRate" value="70" min="0" max="100">
                <span>(政策实际效果概率)</span>
            </div>
            
            <div class="section-title">
                <h3>资源参数</h3>
            </div>
            <div class="param-group">
                <label>初始资源总量:</label>
                <input type="number" id="initialResources" value="50000" min="1000">
            </div>
            <div class="param-group">
                <label>每人年资源消耗:</label>
                <input type="number" id="resourceConsumption" value="60" min="10" max="200">
            </div>
            <div class="param-group">
                <label>资源年增量范围:</label>
                <input type="number" id="minResourceGain" value="1000" min="0">
                <span>至</span>
                <input type="number" id="maxResourceGain" value="5000" min="1">
            </div>
            
            <div class="section-title">
                <h3>住房参数</h3>
            </div>
            <div class="param-group">
                <label>初始住房数量:</label>
                <input type="number" id="initialHousing" value="600" min="10">
            </div>
            <div class="param-group">
                <label>住房年增量范围:</label>
                <input type="number" id="minHousingGain" value="10" min="0">
                <span>至</span>
                <input type="number" id="maxHousingGain" value="50" min="1">
            </div>
            <div class="param-group">
                <label>模拟速度(年/秒):</label>
                <input type="number" id="simulationSpeed" value="1" min="0.1" max="10" step="0.1">
            </div>
        </div>
        
        <div class="controls">
            <button id="startBtn">开始模拟</button>
            <button id="pauseBtn" disabled>暂停</button>
            <button id="resetBtn">重置</button>
            <button id="immigrationBtn" class="policy-btn">开放移民</button>
            <button id="birthControlBtn" class="policy-btn">启用生育控制</button>
            <button id="encourageBirthBtn" class="policy-btn">启用鼓励生育</button>
            <!-- 新增导出按钮 -->
            <button id="exportBtn" class="export-btn">导出全部图表</button>
        </div>
        
        <!-- 导出进度提示 -->
        <div class="export-progress" id="exportProgress">
            正在导出图表... (0/5)
        </div>
        
        <div class="stats">
            <!-- 统计区域保持不变 -->
            <div class="stat-item">当前人口: <span id="currentPopulation">500.0</span></div>
            <div class="stat-item">模拟时间: <span id="elapsedTime">0.00 年</span></div>
            <div class="stat-item">自然增长率: <span id="growthRate">0.00‰</span></div>
            <div class="stat-item">住房率: <span id="housingRate">83.3%</span></div>
            <div class="stat-item">资源剩余量: <span id="resourcesLeft">50000.0</span></div>
            <div class="stat-item">移民数量: <span id="immigrationCount">0.0</span></div>
            <div class="stat-item">本年度出生: <span id="currentYearBirths">0.0</span></div>
            <div class="stat-item">累计死亡: <span id="deathCount">0.0</span></div>
            <div class="stat-item">政策生效概率: <span id="policyEffectRate">70%</span></div>
            <div class="stat-item">预计资源可用: <span id="resourceYearsLeft">16.7 年</span></div>
        </div>
        
        <div class="charts-container">
            <!-- 图表区域保持不变 -->
            <div>
                <h3>人口与移民变化</h3>
                <canvas id="populationChart"></canvas>
            </div>
            <div>
                <h3>资源剩余量变化</h3>
                <canvas id="resourcesChart"></canvas>
            </div>
            <div>
                <h3>住房率变化 (%)</h3>
                <canvas id="housingChart"></canvas>
            </div>
            <div>
                <h3>自然增长率变化 (‰)</h3>
                <canvas id="growthRateChart"></canvas>
            </div>
            <div>
                <h3>年度出生人数变化</h3>
                <canvas id="birthsChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // 全局状态变量
        let isRunning = false;
        let isImmigrationOpen = false;
        let isBirthControlActive = false;
        let isEncourageBirthActive = false;
        let isCollapsed = false;
        let intervalId = null;
        
        // 核心模拟变量（保留小数）
        let currentPopulation = 500.0;
        let elapsedTime = 0.00;
        let currentYear = 0;
        let deathCount = 0.0;
        let totalBirths = 0.0;
        let currentYearBirths = 0.0;
        let annualBirthQuota = 40.0;
        let immigrationCount = 0.0;
        let housing = 600.0;
        let resources = 50000.0;
        
        // 数据跟踪数组
        const timeData = [0.00];
        const populationData = [parseFloat(currentPopulation.toFixed(1))];
        const immigrationData = [0.0];
        const growthRateData = [0.00];
        const housingRateData = [parseFloat((currentPopulation / housing * 100).toFixed(1))];
        const resourcesData = [parseFloat(resources.toFixed(1))];
        const birthsData = [0.0];
        
        // DOM元素引用（新增导出相关元素）
        const elements = {
            // 原有元素保持不变
            currentPopulation: document.getElementById('currentPopulation'),
            elapsedTime: document.getElementById('elapsedTime'),
            growthRate: document.getElementById('growthRate'),
            housingRate: document.getElementById('housingRate'),
            resourcesLeft: document.getElementById('resourcesLeft'),
            immigrationCount: document.getElementById('immigrationCount'),
            deathCount: document.getElementById('deathCount'),
            currentYearBirths: document.getElementById('currentYearBirths'),
            policyEffectRate: document.getElementById('policyEffectRate'),
            resourceYearsLeft: document.getElementById('resourceYearsLeft'),
            startBtn: document.getElementById('startBtn'),
            pauseBtn: document.getElementById('pauseBtn'),
            resetBtn: document.getElementById('resetBtn'),
            immigrationBtn: document.getElementById('immigrationBtn'),
            birthControlBtn: document.getElementById('birthControlBtn'),
            encourageBirthBtn: document.getElementById('encourageBirthBtn'),
            collapseMsg: document.getElementById('collapseMsg'),
            collapseReason: document.getElementById('collapseReason'),
            exportBtn: document.getElementById('exportBtn'),
            exportProgress: document.getElementById('exportProgress'),
            
            // 参数输入
            initialPopulation: document.getElementById('initialPopulation'),
            baseBirthsPerYear: document.getElementById('baseBirthsPerYear'),
            immigrationRate: document.getElementById('immigrationRate'),
            minLifeSpan: document.getElementById('minLifeSpan'),
            maxLifeSpan: document.getElementById('maxLifeSpan'),
            birthControlAmount: document.getElementById('birthControlAmount'),
            encourageBirthAmount: document.getElementById('encourageBirthAmount'),
            policyFollowRate: document.getElementById('policyFollowRate'),
            initialResources: document.getElementById('initialResources'),
            resourceConsumption: document.getElementById('resourceConsumption'),
            minResourceGain: document.getElementById('minResourceGain'),
            maxResourceGain: document.getElementById('maxResourceGain'),
            initialHousing: document.getElementById('initialHousing'),
            minHousingGain: document.getElementById('minHousingGain'),
            maxHousingGain: document.getElementById('maxHousingGain'),
            simulationSpeed: document.getElementById('simulationSpeed')
        };
        
        // 初始化图表（保存图表引用以便导出）
        const populationChart = new Chart(
            document.getElementById('populationChart').getContext('2d'),
            {
                type: 'line',
                data: {
                    labels: timeData,
                    datasets: [
                        { 
                            label: '总人口', 
                            data: populationData, 
                            borderColor: 'rgb(75, 192, 192)', 
                            tension: 0.6,
                            pointRadius: 0.5,
                            borderWidth: 1.5
                        },
                        { 
                            label: '移民累计', 
                            data: immigrationData, 
                            borderColor: 'rgb(255, 159, 64)', 
                            tension: 0.6,
                            pointRadius: 0.5,
                            borderWidth: 1.5
                        }
                    ]
                },
                options: { 
                    responsive: true,
                    scales: { 
                        y: { beginAtZero: true, title: { display: true, text: '人口数量' }, ticks: { precision: 1 } },
                        x: { title: { display: true, text: '时间（年）' }, ticks: { precision: 2 } } 
                    },
                    animation: { duration: 0 },
                    elements: { line: { tension: 0.6 } }
                }
            }
        );
        
        const resourcesChart = new Chart(
            document.getElementById('resourcesChart').getContext('2d'),
            {
                type: 'line',
                data: { 
                    labels: timeData, 
                    datasets: [{ 
                        label: '资源剩余量', 
                        data: resourcesData, 
                        borderColor: 'rgb(153, 102, 255)',
                        backgroundColor: 'rgba(153, 102, 255, 0.1)',
                        tension: 0.6,
                        pointRadius: 0.5,
                        borderWidth: 1.5,
                        fill: true
                    }] 
                },
                options: { 
                    responsive: true,
                    scales: { 
                        y: { beginAtZero: true, title: { display: true, text: '资源数量' }, ticks: { precision: 1 } },
                        x: { title: { display: true, text: '时间（年）' }, ticks: { precision: 2 } } 
                    },
                    animation: { duration: 0 },
                    elements: { line: { tension: 0.6 } }
                }
            }
        );
        
        const housingChart = new Chart(
            document.getElementById('housingChart').getContext('2d'),
            {
                type: 'line',
                data: { 
                    labels: timeData, 
                    datasets: [{ 
                        label: '住房率 (%)', 
                        data: housingRateData, 
                        borderColor: 'rgb(54, 162, 235)',
                        tension: 0.6,
                        pointRadius: 0.5,
                        borderWidth: 1.5
                    }] 
                },
                options: { 
                    responsive: true,
                    scales: { 
                        y: { min: 0, max: 150, title: { display: true, text: '住房率 (%)' }, ticks: { precision: 1 } },
                        x: { title: { display: true, text: '时间（年）' }, ticks: { precision: 2 } } 
                    },
                    animation: { duration: 0 },
                    elements: { line: { tension: 0.6 } }
                }
            }
        );
        
        const growthRateChart = new Chart(
            document.getElementById('growthRateChart').getContext('2d'),
            {
                type: 'line',
                data: { 
                    labels: timeData, 
                    datasets: [{ 
                        label: '自然增长率 (‰)', 
                        data: growthRateData, 
                        borderColor: 'rgb(255, 99, 132)',
                        tension: 0.6,
                        pointRadius: 0.5,
                        borderWidth: 1.5
                    }] 
                },
                options: { 
                    responsive: true,
                    scales: { 
                        y: { title: { display: true, text: '增长率 (‰)' }, ticks: { precision: 2 } },
                        x: { title: { display: true, text: '时间（年）' }, ticks: { precision: 2 } } 
                    },
                    animation: { duration: 0 },
                    elements: { line: { tension: 0.6 } }
                }
            }
        );
        
        const birthsChart = new Chart(
            document.getElementById('birthsChart').getContext('2d'),
            {
                type: 'line',
                data: { 
                    labels: timeData, 
                    datasets: [{ 
                        label: '年度出生人数', 
                        data: birthsData, 
                        borderColor: 'rgb(79, 195, 74)',
                        backgroundColor: 'rgba(79, 195, 74, 0.1)',
                        tension: 0.6,
                        pointRadius: 0.5,
                        borderWidth: 1.5,
                        fill: true
                    }] 
                },
                options: { 
                    responsive: true,
                    scales: { 
                        y: { beginAtZero: true, title: { display: true, text: '出生人数' }, ticks: { precision: 1 } },
                        x: { title: { display: true, text: '时间（年）' }, ticks: { precision: 2 } } 
                    },
                    animation: { duration: 0 },
                    elements: { line: { tension: 0.6 } }
                }
            }
        );
        
        // 图表信息列表（用于导出）
        const chartsToExport = [
            { chart: populationChart, name: '人口与移民变化', id: 'populationChart' },
            { chart: resourcesChart, name: '资源剩余量变化', id: 'resourcesChart' },
            { chart: housingChart, name: '住房率变化', id: 'housingChart' },
            { chart: growthRateChart, name: '自然增长率变化', id: 'growthRateChart' },
            { chart: birthsChart, name: '年度出生人数变化', id: 'birthsChart' }
        ];
        
        // 原有工具函数保持不变
        function getRandomInt(min, max) {
            const random = Math.random() * (max - min) + min;
            return parseFloat(random.toFixed(1));
        }
        
        function isWithinProbability(percentage) {
            const random = parseFloat((Math.random() * 100).toFixed(2));
            return random < percentage;
        }
        
        function checkCollapse() {
            if (currentPopulation <= 0.1) {
                return "人口灭绝";
            }
            if (resources <= 0.1) {
                return "资源枯竭";
            }
            if (currentPopulation > housing * 1.5) {
                return "住房严重短缺，社会崩溃";
            }
            return null;
        }
        
        function calculateAnnualDeaths() {
            const minLife = parseInt(elements.minLifeSpan.value);
            const maxLife = parseInt(elements.maxLifeSpan.value);
            const avgLifeSpan = (minLife + maxLife) / 2;
            const deaths = currentPopulation / avgLifeSpan;
            return parseFloat(deaths.toFixed(1));
        }
        
        function calculateAnnualBirthQuota() {
            let quota = parseFloat(elements.baseBirthsPerYear.value);
            const policyFollowRate = parseInt(elements.policyFollowRate.value);
            
            if (isBirthControlActive && isWithinProbability(policyFollowRate)) {
                const reduceAmount = parseFloat(elements.birthControlAmount.value);
                quota = parseFloat((quota - reduceAmount).toFixed(1));
            }
            
            if (isEncourageBirthActive && isWithinProbability(policyFollowRate)) {
                const addAmount = parseFloat(elements.encourageBirthAmount.value);
                quota = parseFloat((quota + addAmount).toFixed(1));
            }
            
            return Math.max(0.1, quota);
        }
        
        function calculateResourceYearsLeft() {
            const annualConsumption = currentPopulation * parseInt(elements.resourceConsumption.value);
            if (annualConsumption <= 0.1) return 0.0;
            const years = resources / annualConsumption;
            return parseFloat(years.toFixed(1));
        }
        
        function calculateHousingRate() {
            if (housing <= 0.1) return 0.0;
            const rate = (currentPopulation / housing) * 100;
            return parseFloat(rate.toFixed(1));
        }
        
        function calculateGrowthRate(annualBirths, annualDeaths) {
            if (currentPopulation <= 0.1) return 0.00;
            const rate = ((annualBirths - annualDeaths) / currentPopulation) * 1000;
            return parseFloat(rate.toFixed(2));
        }
        
        // 更新模拟数据函数保持不变
        function updateSimulation() {
            if (isCollapsed) return;
            
            const immigrationRate = parseFloat(elements.immigrationRate.value);
            const resourceConsumption = parseFloat(elements.resourceConsumption.value);
            const minResourceGain = parseFloat(elements.minResourceGain.value);
            const maxResourceGain = parseFloat(elements.maxResourceGain.value);
            const minHousingGain = parseFloat(elements.minHousingGain.value);
            const maxHousingGain = parseFloat(elements.maxHousingGain.value);
            const policyFollowRate = parseInt(elements.policyFollowRate.value);
            const simulationSpeed = parseFloat(elements.simulationSpeed.value);
            
            const interval = 20;
            const timeIncrement = parseFloat((simulationSpeed * interval / 1000).toFixed(4));
            
            const prevYear = currentYear;
            currentYear = Math.floor(elapsedTime + timeIncrement);
            if (currentYear > prevYear) {
                birthsData.push(parseFloat(currentYearBirths.toFixed(1)));
                annualBirthQuota = calculateAnnualBirthQuota();
                
                const annualDeaths = calculateAnnualDeaths();
                const deathsThisStep = parseFloat((annualDeaths * timeIncrement).toFixed(1));
                currentPopulation = parseFloat((currentPopulation - deathsThisStep).toFixed(1));
                deathCount = parseFloat((deathCount + deathsThisStep).toFixed(1));
                
                currentYearBirths = 0.0;
                
                const resourceGain = getRandomInt(minResourceGain, maxResourceGain);
                const resourceGainThisStep = parseFloat((resourceGain * timeIncrement).toFixed(1));
                resources = parseFloat((resources + resourceGainThisStep).toFixed(1));
                
                const housingGain = getRandomInt(minHousingGain, maxHousingGain);
                const housingGainThisStep = parseFloat((housingGain * timeIncrement).toFixed(1));
                housing = parseFloat((housing + housingGainThisStep).toFixed(1));
            }
            
            const birthsThisStep = parseFloat((annualBirthQuota * timeIncrement).toFixed(1));
            currentPopulation = parseFloat((currentPopulation + birthsThisStep).toFixed(1));
            currentYearBirths = parseFloat((currentYearBirths + birthsThisStep).toFixed(1));
            totalBirths = parseFloat((totalBirths + birthsThisStep).toFixed(1));
            
            if (isImmigrationOpen) {
                const immigrationThisStep = parseFloat((immigrationRate * timeIncrement).toFixed(1));
                currentPopulation = parseFloat((currentPopulation + immigrationThisStep).toFixed(1));
                immigrationCount = parseFloat((immigrationCount + immigrationThisStep).toFixed(1));
            }
            
            if (currentPopulation < 0.1) currentPopulation = 0.0;
            
            const resourceConsumeThisStep = parseFloat((currentPopulation * resourceConsumption * timeIncrement).toFixed(1));
            resources = parseFloat((resources - resourceConsumeThisStep).toFixed(1));
            if (resources < 0.1) resources = 0.0;
            
            elapsedTime = parseFloat((elapsedTime + timeIncrement).toFixed(2));
            
            const currentAnnualBirths = parseFloat(annualBirthQuota.toFixed(1));
            const currentAnnualDeaths = calculateAnnualDeaths();
            const growthRate = calculateGrowthRate(currentAnnualBirths, currentAnnualDeaths);
            const housingRate = calculateHousingRate();
            const resourceYearsLeft = calculateResourceYearsLeft();
            
            elements.currentPopulation.textContent = currentPopulation.toFixed(1);
            elements.elapsedTime.textContent = elapsedTime.toFixed(2) + ' 年';
            elements.growthRate.textContent = growthRate.toFixed(2) + '‰';
            elements.housingRate.textContent = housingRate.toFixed(1) + '%';
            elements.resourcesLeft.textContent = resources.toFixed(1);
            elements.immigrationCount.textContent = immigrationCount.toFixed(1);
            elements.deathCount.textContent = deathCount.toFixed(1);
            elements.currentYearBirths.textContent = currentYearBirths.toFixed(1);
            elements.policyEffectRate.textContent = policyFollowRate + '%';
            elements.resourceYearsLeft.textContent = resourceYearsLeft.toFixed(1) + ' 年';
            
            const sampleStep = 0.02;
            const currentTimeStep = Math.floor(elapsedTime / sampleStep) * sampleStep;
            const lastTimeStep = timeData[timeData.length - 1];
            
            if (Math.abs(currentTimeStep - lastTimeStep) >= sampleStep - 0.001) {
                timeData.push(parseFloat(currentTimeStep.toFixed(2)));
                populationData.push(parseFloat(currentPopulation.toFixed(1)));
                immigrationData.push(parseFloat(immigrationCount.toFixed(1)));
                growthRateData.push(parseFloat(growthRate.toFixed(2)));
                housingRateData.push(parseFloat(housingRate.toFixed(1)));
                resourcesData.push(parseFloat(resources.toFixed(1)));
                
                const maxDataPoints = 500;
                if (timeData.length > maxDataPoints) {
                    timeData.shift();
                    populationData.shift();
                    immigrationData.shift();
                    growthRateData.shift();
                    housingRateData.shift();
                    resourcesData.shift();
                    if (birthsData.length > maxDataPoints) birthsData.shift();
                }
                
                populationChart.update('none');
                resourcesChart.update('none');
                housingChart.update('none');
                growthRateChart.update('none');
                birthsChart.update('none');
            }
            
            const collapseReason = checkCollapse();
            if (collapseReason) {
                isCollapsed = true;
                pauseSimulation();
                elements.collapseReason.textContent = collapseReason;
                elements.collapseMsg.style.display = 'block';
            }
        }
        
        // 控制函数保持不变
        function startSimulation() {
            if (!isRunning && !isCollapsed) {
                isRunning = true;
                const interval = 20;
                intervalId = setInterval(updateSimulation, interval);
                elements.startBtn.disabled = true;
                elements.pauseBtn.disabled = false;
            }
        }
        
        function pauseSimulation() {
            if (isRunning) {
                isRunning = false;
                clearInterval(intervalId);
                elements.startBtn.disabled = false;
                elements.pauseBtn.disabled = true;
            }
        }
        
        function resetSimulation() {
            pauseSimulation();
            isCollapsed = false;
            isImmigrationOpen = false;
            isBirthControlActive = false;
            isEncourageBirthActive = false;
            
            currentPopulation = parseFloat(elements.initialPopulation.value);
            elapsedTime = 0.00;
            currentYear = 0;
            deathCount = 0.0;
            totalBirths = 0.0;
            currentYearBirths = 0.0;
            annualBirthQuota = parseFloat(elements.baseBirthsPerYear.value);
            immigrationCount = 0.0;
            housing = parseFloat(elements.initialHousing.value);
            resources = parseFloat(elements.initialResources.value);
            
            timeData.length = 0;
            populationData.length = 0;
            immigrationData.length = 0;
            growthRateData.length = 0;
            housingRateData.length = 0;
            resourcesData.length = 0;
            birthsData.length = 0;
            
            timeData.push(0.00);
            populationData.push(parseFloat(currentPopulation.toFixed(1)));
            immigrationData.push(0.0);
            growthRateData.push(0.00);
            housingRateData.push(calculateHousingRate());
            resourcesData.push(parseFloat(resources.toFixed(1)));
            birthsData.push(0.0);
            
            elements.currentPopulation.textContent = currentPopulation.toFixed(1);
            elements.elapsedTime.textContent = '0.00 年';
            elements.growthRate.textContent = '0.00‰';
            elements.housingRate.textContent = calculateHousingRate().toFixed(1) + '%';
            elements.resourcesLeft.textContent = resources.toFixed(1);
            elements.immigrationCount.textContent = '0.0';
            elements.deathCount.textContent = '0.0';
            elements.currentYearBirths.textContent = '0.0';
            elements.resourceYearsLeft.textContent = calculateResourceYearsLeft().toFixed(1) + ' 年';
            
            elements.immigrationBtn.classList.remove('active');
            elements.immigrationBtn.textContent = '开放移民';
            elements.birthControlBtn.classList.remove('active');
            elements.birthControlBtn.textContent = '启用生育控制';
            elements.encourageBirthBtn.classList.remove('active');
            elements.encourageBirthBtn.textContent = '启用鼓励生育';
            elements.collapseMsg.style.display = 'none';
            
            populationChart.update('none');
            resourcesChart.update('none');
            housingChart.update('none');
            growthRateChart.update('none');
            birthsChart.update('none');
        }
        
        function toggleImmigration() {
            if (!isCollapsed) {
                isImmigrationOpen = !isImmigrationOpen;
                elements.immigrationBtn.classList.toggle('active');
                elements.immigrationBtn.textContent = isImmigrationOpen ? '关闭移民' : '开放移民';
            }
        }
        
        function toggleBirthControl() {
            if (!isCollapsed) {
                if (!isBirthControlActive && isEncourageBirthActive) {
                    isEncourageBirthActive = false;
                    elements.encourageBirthBtn.classList.remove('active');
                    elements.encourageBirthBtn.textContent = '启用鼓励生育';
                }
                
                isBirthControlActive = !isBirthControlActive;
                elements.birthControlBtn.classList.toggle('active');
                elements.birthControlBtn.textContent = isBirthControlActive ? '关闭生育控制' : '启用生育控制';
            }
        }
        
        function toggleEncourageBirth() {
            if (!isCollapsed) {
                if (!isEncourageBirthActive && isBirthControlActive) {
                    isBirthControlActive = false;
                    elements.birthControlBtn.classList.remove('active');
                    elements.birthControlBtn.textContent = '启用生育控制';
                }
                
                isEncourageBirthActive = !isEncourageBirthActive;
                elements.encourageBirthBtn.classList.toggle('active');
                elements.encourageBirthBtn.textContent = isEncourageBirthActive ? '关闭鼓励生育' : '启用鼓励生育';
            }
        }
        
        // 新增：导出图表功能
        function exportAllCharts() {
            // 导出前暂停模拟，避免图表数据变化
            const wasRunning = isRunning;
            if (wasRunning) pauseSimulation();
            
            // 显示进度提示
            elements.exportProgress.style.display = 'block';
            elements.exportBtn.disabled = true;
            
            // 准备导出的图表列表
            const exports = [];
            let completed = 0;
            
            // 逐个导出图表
            chartsToExport.forEach((item, index) => {
                setTimeout(() => {
                    try {
                        // 获取图表Canvas
                        const canvas = document.getElementById(item.id);
                        
                        // 创建高清副本（2倍分辨率）
                        const tempCanvas = document.createElement('canvas');
                        const tempCtx = tempCanvas.getContext('2d');
                        const scale = 2; // 缩放倍数，提高清晰度
                        tempCanvas.width = canvas.width * scale;
                        tempCanvas.height = canvas.height * scale;
                        tempCtx.scale(scale, scale);
                        tempCtx.drawImage(canvas, 0, 0);
                        
                        // 转换为图片并下载
                        tempCanvas.toBlob(blob => {
                            const fileName = `${item.name}_${elapsedTime.toFixed(2)}年.png`;
                            saveAs(blob, fileName);
                            exports.push({ name: item.name, blob: blob });
                            
                            // 更新进度
                            completed++;
                            elements.exportProgress.textContent = 
                                `正在导出图表... (${completed}/${chartsToExport.length})`;
                            
                            // 全部完成后恢复状态
                            if (completed === chartsToExport.length) {
                                elements.exportProgress.textContent = "导出完成！";
                                setTimeout(() => {
                                    elements.exportProgress.style.display = 'none';
                                    elements.exportBtn.disabled = false;
                                    // 如果之前在运行，恢复运行状态
                                    if (wasRunning) startSimulation();
                                }, 2000);
                            }
                        }, 'image/png');
                    } catch (error) {
                        console.error(`导出${item.name}失败:`, error);
                        completed++;
                        if (completed === chartsToExport.length) {
                            elements.exportProgress.textContent = "部分图表导出失败";
                            setTimeout(() => {
                                elements.exportProgress.style.display = 'none';
                                elements.exportBtn.disabled = false;
                                if (wasRunning) startSimulation();
                            }, 2000);
                        }
                    }
                }, index * 500); // 每个图表间隔500ms导出，避免浏览器阻塞
            });
        }
        
        // 绑定事件（新增导出按钮事件）
        elements.startBtn.addEventListener('click', startSimulation);
        elements.pauseBtn.addEventListener('click', pauseSimulation);
        elements.resetBtn.addEventListener('click', resetSimulation);
        elements.immigrationBtn.addEventListener('click', toggleImmigration);
        elements.birthControlBtn.addEventListener('click', toggleBirthControl);
        elements.encourageBirthBtn.addEventListener('click', toggleEncourageBirth);
        elements.exportBtn.addEventListener('click', exportAllCharts);
    </script>
</body>
</html>
